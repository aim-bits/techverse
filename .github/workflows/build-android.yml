name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Diagnose Kotlin dependencies
        working-directory: android
        run: |
          ./gradlew app:dependencyInsight --dependency kotlin-stdlib-jdk8 --configuration debugRuntimeClasspath
          ./gradlew app:dependencyInsight --dependency kotlin-stdlib-jdk7 --configuration debugRuntimeClasspath
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: techverse-gear-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk